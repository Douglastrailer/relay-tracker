<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Track your repair · Relay</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  :root{ --ink:#0E2A31; --soft:#4A5B62; --line:#D5DEE2; --bg:#F3F5F7; --teal:#0D5C6E; --green:#2f8f5b; --amber:#B7791F; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',Arial,sans-serif; line-height:1.5; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  main{ max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  .brand{ font-family:'Archivo',sans-serif; font-weight:800; color:var(--teal); font-size:1.1rem; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-top:14px; }
  h1{ font-family:'Archivo',sans-serif; font-size:1.5rem; margin:10px 0 4px; }
  .meta{ color:var(--soft); font-size:.92rem; }
  .status{ font-size:1.25rem; font-weight:700; margin:6px 0 2px; }
  .steps{ list-style:none; padding:0; margin:14px 0 0; }
  .steps li{ display:flex; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); color:var(--soft); }
  .steps li:first-child{ border-top:none; }
  .dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--line); flex:none; }
  .steps li.done .dot{ background:var(--green); border-color:var(--green); }
  .steps li.now{ color:var(--ink); font-weight:700; }
  .steps li.now .dot{ background:var(--teal); border-color:var(--teal); box-shadow:0 0 0 4px rgba(13,92,110,.15); }
  #map{ height:260px; border-radius:12px; margin-top:12px; border:1px solid var(--line); }
  .live{ display:inline-flex; align-items:center; gap:6px; font-size:.85rem; color:var(--green); font-weight:700; }
  .live::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--green); }
  .btn{ display:inline-block; margin-top:14px; min-height:48px; padding:12px 18px; border-radius:10px; background:var(--teal); color:#fff; font-weight:700; text-decoration:none; text-align:center; border:none; font:inherit; cursor:pointer; }
  .note{ font-size:.85rem; color:var(--soft); margin-top:14px; }
  .hidden{ display:none !important; }
  footer{ text-align:center; color:var(--soft); font-size:.8rem; margin-top:24px; }
  footer a{ color:var(--teal); }
</style>
</head>
<body>
<main>
  <div class="brand">Relay</div>
  <div id="loading" class="card meta">Loading your repair…</div>
  <div id="gone" class="card hidden">
    <h1>This link is no longer active</h1>
    <p class="meta">Ask the shop for an updated tracking link.</p>
  </div>
  <div id="view" class="hidden">
    <div class="card">
      <div class="meta" id="shop"></div>
      <h1 id="vehicle"></h1>
      <div class="meta" id="wo"></div>
      <div class="status" id="statusText"></div>
      <div class="meta" id="techLine"></div>
      <ol class="steps" id="steps"></ol>
    </div>
    <div class="card hidden" id="mapCard">
      <div class="live" id="liveText">Live location</div>
      <div id="map"></div>
      <div class="note" id="mapNote"></div>
    </div>
    <div class="card hidden" id="estCard">
      <div class="status" style="font-size:1.05rem">Your estimate is ready</div>
      <p class="meta">Review the estimate and approve or ask for changes.</p>
      <a class="btn" id="estBtn" href="#">Review estimate</a>
    </div>
    <p class="note" id="privacy"></p>
  </div>
  <footer>Powered by <a href="https://relayfleet.us">Relay</a></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://okcogufppsubntrchfuf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Z8qgdFjVetqSOfmZKhxkpQ_XX2tYHDp';
  const token = new URLSearchParams(location.search).get('t');
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  // the steps a customer follows, in order; mobile jobs include the drive
  const MOBILE = [['assigned','Technician assigned'],['en_route','Technician on the way'],['on_site','Technician on site'],['repairing','Repair in progress'],['complete','Completed']];
  const SHOP_SIDE = [['assigned','Assigned'],['diagnosing','Diagnosis'],['repairing','Repair in progress'],['quality_control','Quality check'],['complete','Completed']];
  const LABEL = { new:'Received', estimate:'Estimate being prepared', approval:'Waiting for your approval', assigned:'Assigned', en_route:'Technician on the way', on_site:'Technician on site',
    diagnosing:'Diagnosing', repairing:'Repair in progress', quality_control:'Quality check', waiting_parts:'Waiting for parts', complete:'Completed', invoiced:'Completed', paid:'Completed', cancelled:'Cancelled' };
  const ORDER = ['new','estimate','approval','assigned','en_route','on_site','diagnosing','repairing','quality_control','waiting_parts','complete'];
  // which stage each status is in, for each kind of job (stage index in the lists above)
  const STAGE_MOBILE = { new:0, estimate:0, approval:0, assigned:0, en_route:1, on_site:2, diagnosing:3, repairing:3, quality_control:3, waiting_parts:3, complete:4, invoiced:4, paid:4 };
  const STAGE_SHOP = { new:0, estimate:0, approval:0, assigned:0, diagnosing:1, repairing:2, waiting_parts:2, quality_control:3, complete:4, invoiced:4, paid:4 };
  let map = null, marker = null, timer = null;

  function ago(ts){ const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000)); return s < 60 ? s + ' seconds ago' : Math.round(s / 60) + ' min ago'; }

  function paint(d){
    $('loading').classList.add('hidden');
    if(!d){ $('gone').classList.remove('hidden'); return; }
    $('view').classList.remove('hidden');
    $('shop').textContent = d.shop ? 'Repair with ' + d.shop : 'Your repair';
    $('vehicle').textContent = d.vehicle ? 'Vehicle ' + d.vehicle : 'Your vehicle';
    $('wo').textContent = d.work_order ? 'Work order ' + d.work_order : '';
    const st = d.status, mobile = d.service === 'mobile';
    $('statusText').textContent = d.closed ? (st === 'cancelled' ? 'This repair was cancelled' : 'Your repair is complete') : (LABEL[st] || 'In progress');
    $('techLine').textContent = d.technician && !d.closed ? 'Technician: ' + d.technician : '';
    // progress: each status belongs to one stage; the stages before it are done
    const steps = mobile ? MOBILE : SHOP_SIDE;
    const stage = mobile ? STAGE_MOBILE[st] : STAGE_SHOP[st];
    const cur = d.closed ? steps.length - 1 : (stage == null ? 0 : stage);
    $('steps').innerHTML = steps.map(([k, label], i) => `<li class="${d.closed || i < cur ? 'done' : i === cur ? 'now' : ''}"><span class="dot"></span>${esc(label)}</li>`).join('');
    if(d.estimate_link){ $('estCard').classList.remove('hidden'); $('estBtn').href = d.estimate_link; }
    $('privacy').textContent = 'Shared by ' + (d.shop || 'the shop') + ' so you can follow this repair. ' + (mobile ? 'The technician\'s location is shown only while on the way or on site, and only while the location is current. ' : '') + 'This page shows no prices or contact details.';
    if(mobile && d.position){ showMap(d.position); }
    else $('mapCard').classList.add('hidden');
  }

  function showMap(p){
    $('mapCard').classList.remove('hidden');
    $('liveText').textContent = 'Live location · updated ' + ago(p.updated_at);
    $('mapNote').textContent = 'The map updates by itself. If the technician stops sharing location, it stops here.';
    if(!map){
      map = L.map('map', { attributionControl: true }).setView([p.lat, p.lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
      marker = L.marker([p.lat, p.lng]).addTo(map);
    } else { marker.setLatLng([p.lat, p.lng]); map.panTo([p.lat, p.lng]); }
  }

  async function load(){
    if(!token){ paint(null); return; }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
    const { data, error } = await sb.rpc('get_job_tracking', { p_token: token });
    if(error){ $('loading').textContent = 'The tracking page could not load. Check your connection and refresh.'; return; }
    paint(data);
    // keep the position current while the page is open; stop when the repair closes or the link ends
    if(data && !data.closed && (data.service === 'mobile')){ clearInterval(timer); timer = setInterval(load, 20000); }
    else clearInterval(timer);
  }
  load();
})();
</script>
</body>
</html>
